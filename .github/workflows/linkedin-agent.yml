name: LinkedIn AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"   # 09:00 IST
    - cron: "30 13 * * *"  # 19:00 IST

# Prevent two agent runs from modifying data/posts.json at the same time.
concurrency:
  group: linkedin-ai-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. DEBUG CHECKOUT
      # ======================================================

      - name: Debug checkout
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== WORKFLOW FILE ==="
          grep -n -A35 "if dry_run:" src/graph/workflow.py

      # ======================================================
      # 3. SETUP PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 4. INSTALL UV
      # ======================================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ======================================================
      # 5. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          uv sync --frozen

      # ======================================================
      # 6. RUN LINKEDIN AI AGENT
      # ======================================================

      - name: Run LinkedIn AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION }}

          DRY_RUN: ${{ secrets.DRY_RUN }}

        run: |
          echo "========================================"
          echo "🚀 STARTING LINKEDIN AI AGENT"
          echo "========================================"

          echo "DRY_RUN configured: ${DRY_RUN}"

          uv run python -m src.main

      # ======================================================
      # 7. SAVE HISTORY
      # ======================================================

      - name: Save history
        run: |
          echo "========================================"
          echo "💾 SAVING HISTORY"
          echo "========================================"

          git config user.name "linkedin-ai-agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/posts.json

          if git diff --cached --quiet; then
            echo "ℹ️ No history changes to commit."
            exit 0
          fi

          echo "📝 History changes detected."

          git commit -m "Update LinkedIn agent history"

          echo "🔄 Synchronizing with origin/main..."

          git pull --rebase origin main

          echo "📤 Pushing history..."

          git push origin main

          echo "✅ History successfully pushed."