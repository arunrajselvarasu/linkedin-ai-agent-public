[project]
name = "linkedin-ai-agent"
version = "0.1.0"
description = "Autonomous AI/ML LinkedIn Content Agent using LangGraph"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langchain",
    "langgraph",
    "langchain-groq",
    "pydantic",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "tavily-python",
    "sqlalchemy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
